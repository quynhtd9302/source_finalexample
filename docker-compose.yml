version: "3.8"

services:

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: demohibernate
    ports:
      - "3307:3306"

  app:
    build: .
    container_name: spring-app
    ports:
      - "8899:8899"
    depends_on:
      - mysql