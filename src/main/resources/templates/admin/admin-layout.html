<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(title, activeMenu, content, pageScripts)">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - QuynhHill Coffee Admin'">QuynhHill Coffee Admin</title>
    <link rel="shortcut icon" type="image/png" href="/images/coffee/favicon.svg" />
    <link rel="stylesheet" href="/assets/css/styles.min.css" />
    <link rel="stylesheet" href="/css/coffee-theme.css" />
</head>
<body>
<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
     data-sidebar-position="fixed" data-header-position="fixed">

    <aside class="left-sidebar">
        <div>
            <div class="brand-logo d-flex align-items-center justify-content-between">
                <a th:href="@{/admin}" class="text-nowrap logo-img d-flex align-items-center gap-2">
                    <img src="/images/coffee/logo.svg" width="36" alt="QuynhHill Coffee" />
                    <span class="fw-semibold fs-5 text-dark">QuynhHill Coffee</span>
                </a>
                <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse">
                    <i class="ti ti-x fs-8"></i>
                </div>
            </div>
            <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
                <ul id="sidebarnav">
                    <li class="nav-small-cap">
                        <i class="ti ti-dots nav-small-cap-icon fs-4"></i>
                        <span class="hide-menu">Tổng quan</span>
                    </li>
                    <li class="sidebar-item">
                        <a class="sidebar-link" th:classappend="${activeMenu == 'dashboard'} ? 'active'" th:href="@{/admin}" aria-expanded="false">
                            <span><i class="ti ti-layout-dashboard"></i></span>
                            <span class="hide-menu">Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-small-cap">
                        <i class="ti ti-dots nav-small-cap-icon fs-4"></i>
                        <span class="hide-menu">Quản lý chuỗi</span>
                    </li>
                    <li class="sidebar-item">
                        <a class="sidebar-link" th:classappend="${activeMenu == 'stores'} ? 'active'" th:href="@{/admin/stores}" aria-expanded="false">
                            <span><i class="ti ti-building-store"></i></span>
                            <span class="hide-menu">Cửa hàng</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a class="sidebar-link" th:classappend="${activeMenu == 'categories'} ? 'active'" th:href="@{/admin/categories}" aria-expanded="false">
                            <span><i class="ti ti-category-2"></i></span>
                            <span class="hide-menu">Danh mục</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a class="sidebar-link" th:classappend="${activeMenu == 'products'} ? 'active'" th:href="@{/admin/products}" aria-expanded="false">
                            <span><i class="ti ti-coffee"></i></span>
                            <span class="hide-menu">Sản phẩm</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a class="sidebar-link" th:classappend="${activeMenu == 'orders'} ? 'active'" th:href="@{/admin/orders}" aria-expanded="false">
                            <span><i class="ti ti-receipt"></i></span>
                            <span class="hide-menu">Đơn hàng</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a class="sidebar-link" th:classappend="${activeMenu == 'users'} ? 'active'" th:href="@{/admin/users}" aria-expanded="false">
                            <span><i class="ti ti-users"></i></span>
                            <span class="hide-menu">Người dùng</span>
                        </a>
                    </li>
                    <li class="nav-small-cap">
                        <i class="ti ti-dots nav-small-cap-icon fs-4"></i>
                        <span class="hide-menu">Khác</span>
                    </li>
                    <li class="sidebar-item">
                        <a class="sidebar-link" th:href="@{/}" aria-expanded="false">
                            <span><i class="ti ti-external-link"></i></span>
                            <span class="hide-menu">Xem trang bán hàng</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <div class="body-wrapper">
        <header class="app-header">
            <nav class="navbar navbar-expand-lg navbar-light">
                <ul class="navbar-nav">
                    <li class="nav-item d-block d-xl-none">
                        <a class="nav-link sidebartoggler nav-icon-hover" id="headerCollapse" href="javascript:void(0)">
                            <i class="ti ti-menu-2"></i>
                        </a>
                    </li>
                </ul>
                <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
                    <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
                        <li class="nav-item dropdown">
                            <a class="nav-link nav-icon-hover d-flex align-items-center gap-2" href="javascript:void(0)" id="drop2" data-bs-toggle="dropdown" aria-expanded="false">
                                <span class="avatar-circle"><i class="ti ti-user"></i></span>
                                <span th:text="${#request.userPrincipal != null} ? ${#request.userPrincipal.name} : 'admin'">admin</span>
                            </a>
                            <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up" aria-labelledby="drop2">
                                <div class="message-body">
                                    <form th:action="@{/logout}" method="post">
                                        <button class="btn btn-outline-primary mx-3 mt-2 d-block" type="submit">Đăng xuất</button>
                                    </form>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <div class="container-fluid" id="admin-content" th:replace="${content} ?: ~{}">
        </div>
    </div>
</div>

<script src="/assets/libs/jquery/dist/jquery.min.js"></script>
<script src="/assets/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/sidebarmenu.js"></script>
<script src="/assets/js/app.min.js"></script>
<script src="/assets/libs/apexcharts/dist/apexcharts.min.js"></script>
<script src="/assets/libs/simplebar/dist/simplebar.js"></script>
<th:block th:replace="${pageScripts} ?: ~{}"></th:block>
</body>
</html>
