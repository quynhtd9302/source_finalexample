<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(${title}, ${activeMenu}, ~{::#content}, ~{})}">
<body>
<div id="content" class="container-fluid">
    <h4 class="fw-semibold mb-4" th:text="${title}">Thêm danh mục</h4>
    <div class="card" style="max-width: 480px;">
        <div class="card-body">
            <form th:action="@{/admin/categories/save}" method="post">
                <div class="mb-3">
                    <label class="form-label">Tên danh mục</label>
                    <input type="text" name="categoryName" class="form-control" required autofocus="autofocus" />
                </div>
                <button type="submit" class="btn btn-coffee">Lưu</button>
                <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Huỷ</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
