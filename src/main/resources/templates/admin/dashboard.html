<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(${title}, ${activeMenu}, ~{::#content}, ~{::#page-scripts})}">
<body>
<div id="content" class="container-fluid">
    <div class="row">
        <div class="col-sm-6 col-xl-3">
            <div class="card stat-card">
                <div class="card-body">
                    <p class="text-muted mb-1">Tổng doanh thu</p>
                    <h4 class="fw-semibold mb-0" th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</h4>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card stat-card">
                <div class="card-body">
                    <p class="text-muted mb-1">Tổng đơn hàng</p>
                    <h4 class="fw-semibold mb-0" th:text="${totalOrders}">0</h4>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card stat-card">
                <div class="card-body">
                    <p class="text-muted mb-1">Cửa hàng</p>
                    <h4 class="fw-semibold mb-0" th:text="${totalStores}">0</h4>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card stat-card">
                <div class="card-body">
                    <p class="text-muted mb-1">Sản phẩm</p>
                    <h4 class="fw-semibold mb-0" th:text="${totalProducts}">0</h4>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-lg-7 d-flex align-items-stretch">
            <div class="card w-100">
                <div class="card-body">
                    <h5 class="card-title fw-semibold mb-4">Doanh thu theo cửa hàng</h5>
                    <div id="revenueChart"></div>
                </div>
            </div>
        </div>
        <div class="col-lg-5 d-flex align-items-stretch">
            <div class="card w-100">
                <div class="card-body">
                    <h5 class="card-title fw-semibold mb-4">Đơn hàng gần đây</h5>
                    <div class="table-responsive">
                        <table class="table text-nowrap mb-0 align-middle">
                            <thead>
                            <tr>
                                <th>Mã</th>
                                <th>Cửa hàng</th>
                                <th>Trạng thái</th>
                                <th>Tổng tiền</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="order : ${recentOrders}">
                                <td th:text="'#' + ${order.id}">#1</td>
                                <td th:text="${order.store != null ? order.store.name : '—'}">—</td>
                                <td th:text="${order.status != null ? order.status.status : '—'}">—</td>
                                <td th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(recentOrders)}">
                                <td colspan="4" class="text-center text-muted">Chưa có đơn hàng nào</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block id="page-scripts">
<script th:inline="javascript">
    /*<![CDATA[*/
    var revenueLabels = /*[[${revenueStoreLabels}]]*/ [];
    var revenueData = /*[[${revenueStoreData}]]*/ [];
    var chartOptions = {
        series: [{ name: "Doanh thu", data: revenueData }],
        chart: { type: "bar", height: 340, toolbar: { show: false }, foreColor: "#adb0bb" },
        colors: ["#8B5E3C"],
        plotOptions: { bar: { borderRadius: 6, columnWidth: "45%" } },
        dataLabels: { enabled: false },
        xaxis: { categories: revenueLabels }
    };
    document.addEventListener("DOMContentLoaded", function () {
        new ApexCharts(document.querySelector("#revenueChart"), chartOptions).render();
    });
    /*]]>*/
</script>
</th:block>
</body>
</html>
