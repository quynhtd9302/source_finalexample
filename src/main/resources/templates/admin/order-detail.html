<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin-layout :: layout(${title}, ${activeMenu}, ~{::#content}, ~{})}">
<body>
<div id="content" class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-semibold mb-0" th:text="'Đơn hàng #' + ${order.id}">Đơn hàng #1</h4>
        <a th:href="@{/admin/orders}" class="btn btn-outline-secondary btn-sm"><i class="ti ti-arrow-left me-1"></i>Quay lại</a>
    </div>

    <div class="row">
        <div class="col-lg-8">
            <div class="card mb-3">
                <div class="card-body">
                    <h6 class="fw-semibold mb-3">Sản phẩm</h6>
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                            <tr><th>Ảnh</th><th>Tên</th><th>Đơn giá</th><th>SL</th><th>Thành tiền</th></tr>
                            </thead>
                            <tbody>
                            <tr th:each="detail : ${order.orderDetails}">
                                <td><img th:src="${detail.productImage}" width="40" height="40" class="rounded" style="object-fit:cover" alt=""/></td>
                                <td th:text="${detail.productName}">Cà phê đen đá</td>
                                <td th:text="${#numbers.formatDecimal(detail.productPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">25.000 đ</td>
                                <td th:text="${detail.quantity}">1</td>
                                <td th:text="${#numbers.formatDecimal(detail.productPrice * detail.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">25.000 đ</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="text-end fw-semibold mt-3 fs-5">
                        Tổng cộng: <span th:text="${#numbers.formatDecimal(order.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card mb-3">
                <div class="card-body">
                    <h6 class="fw-semibold mb-3">Thông tin giao hàng</h6>
                    <p class="mb-1"><strong>Khách hàng:</strong> <span th:text="${order.shipping != null ? order.shipping.name : '—'}"></span></p>
                    <p class="mb-1"><strong>SĐT:</strong> <span th:text="${order.shipping != null ? order.shipping.phone : '—'}"></span></p>
                    <p class="mb-1"><strong>Địa chỉ:</strong> <span th:text="${order.shipping != null ? order.shipping.address : '—'}"></span></p>
                    <p class="mb-1"><strong>Cửa hàng:</strong> <span th:text="${order.store != null ? order.store.name : '—'}"></span></p>
                    <p class="mb-1"><strong>Thanh toán:</strong>
                        <span th:text="${order.paymentMethod == 'BANK_TRANSFER'} ? 'Chuyển khoản ngân hàng' : 'Thanh toán khi nhận hàng (COD)'"></span></p>
                    <p class="mb-1"><strong>Ghi chú:</strong> <span th:text="${order.note}"></span></p>
                </div>
            </div>
            <div class="card">
                <div class="card-body">
                    <h6 class="fw-semibold mb-3">Trạng thái</h6>
                    <form th:action="@{'/admin/orders/' + ${order.id} + '/status'}" method="post" class="d-flex gap-2">
                        <select class="form-select" name="statusId">
                            <option th:each="status : ${statuses}" th:value="${status.id}" th:text="${status.status}"
                                    th:selected="${order.status != null and order.status.id == status.id}"></option>
                        </select>
                        <button type="submit" class="btn btn-coffee">Cập nhật</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
