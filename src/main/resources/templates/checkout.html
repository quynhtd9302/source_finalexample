<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: main-fragment(
                                                ~{::title},
                                                ~{},
                                                ~{/fragments/app-fragments :: nav-default},
                                                ~{:: #checkout-main-content},
                                                ~{/fragments/app-fragments :: copyright}
                                               )}">
<head>
    <title>Thanh toán - QuynhHill Coffee</title>
</head>
<body>

<div id="checkout-main-content" style="margin-top: 90px;">
    <div class="container py-4">
        <h4 class="fw-semibold mb-4">Thanh toán đơn hàng</h4>
        <div class="row g-4">
            <div class="col-md-7">
                <form th:action="@{/prepare-shipping}" method="post" id="shipping-form">
                <div class="card mb-3">
                    <div class="card-body">
                        <h6 class="fw-semibold mb-3">Thông tin giao hàng</h6>
                            <div class="mb-3">
                                <label class="form-label">Họ và tên</label>
                                <input type="text" name="name" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Số điện thoại</label>
                                <input type="text" name="phone" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Địa chỉ nhận hàng</label>
                                <input type="text" name="address" class="form-control" required/>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Cửa hàng nhận đơn</label>
                                <select class="form-select" name="storeId" required>
                                    <option value="">-- Chọn cửa hàng --</option>
                                    <option th:each="store: ${stores}" th:value="${store.id}" th:text="${store.name}"></option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Ghi chú</label>
                                <textarea name="note" class="form-control" rows="2"></textarea>
                            </div>
                    </div>
                </div>

                <div class="card mb-3">
                    <div class="card-body">
                        <h6 class="fw-semibold mb-3">Phương thức thanh toán</h6>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="payCod" value="COD" checked
                                   onclick="document.getElementById('bank-info').style.display='none'"/>
                            <label class="form-check-label" for="payCod">
                                Thanh toán khi nhận hàng (COD)
                            </label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="payBank" value="BANK_TRANSFER"
                                   onclick="document.getElementById('bank-info').style.display='block'"/>
                            <label class="form-check-label" for="payBank">
                                Chuyển khoản ngân hàng
                            </label>
                        </div>
                        <div id="bank-info" class="bg-light-coffee rounded p-3 small mt-2" style="display:none;">
                            Chủ tài khoản: <strong>CÔNG TY QUYNHHILL COFFEE</strong><br/>
                            Số tài khoản: <strong>0123 456 789</strong> — Ngân hàng Vietcombank<br/>
                            Nội dung chuyển khoản: Ghi rõ họ tên và số điện thoại đặt hàng.
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-coffee w-100">Đặt hàng</button>
                </form>
            </div>
            <div class="col-md-5">
                <div class="card">
                    <div class="card-body">
                        <h6 class="fw-semibold mb-3">Đơn hàng của bạn</h6>
                        <div th:each="c: ${listCart}" class="d-flex align-items-center gap-2 mb-2">
                            <img th:src="${c.productImageUrl}" width="40" height="40" style="object-fit:cover" class="rounded"/>
                            <div class="flex-grow-1">
                                <div class="small" th:text="${c.productName}">Tên sản phẩm</div>
                                <div class="small text-muted" th:text="'x ' + ${c.quantity}">x 1</div>
                            </div>
                            <div class="small" th:text="${#numbers.formatDecimal(c.productPrice * c.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</div>
                        </div>
                        <hr/>
                        <div class="d-flex justify-content-between fs-5">
                            <strong>Tổng cộng</strong>
                            <strong th:text="${#numbers.formatDecimal(totalMoney, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</strong>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
