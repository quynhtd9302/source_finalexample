<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: main-fragment(
                                                ~{::title},
                                                ~{},
                                                ~{/fragments/app-fragments :: nav-default},
                                                ~{:: #product-main-content},
                                                ~{/fragments/app-fragments :: copyright}
                                               )}">
<head>
    <title th:text="${product.name} + ' - Chain Coffee'">Chi tiết sản phẩm</title>
</head>
<body>

<div id="product-main-content" style="margin-top: 90px;">
    <div class="container py-4">
        <div class="row g-4">
            <div class="col-md-5">
                <div class="card product-card">
                    <img th:src="${product.imageUrl}" class="card-img-top" style="height:320px;" alt=""/>
                </div>
            </div>
            <div class="col-md-7">
                <h3 class="fw-semibold" th:text="${product.name}">Tên sản phẩm</h3>
                <p class="product-price fs-4" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">25.000 đ</p>
                <p th:text="${product.description}">Mô tả sản phẩm</p>
                <a th:href="@{'/add-to-cart?productId='+${product.id}}" class="btn btn-coffee">
                    <i class="ti ti-shopping-cart-plus me-1"></i>Thêm vào giỏ hàng
                </a>
                <a th:href="@{/products}" class="btn btn-outline-coffee ms-2">Tiếp tục xem thực đơn</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
