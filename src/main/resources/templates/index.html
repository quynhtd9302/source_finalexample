<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: main-fragment(
                                                ~{::title},
                                                ~{},
                                                ~{/fragments/app-fragments :: nav-default},
                                                ~{:: #home-main-content},
                                                ~{/fragments/app-fragments :: copyright}
                                               )}">
<head>
    <title>Chain Coffee - Chuỗi cửa hàng cà phê</title>
</head>
<body>

<div id="home-main-content">
    <section class="hero-section" style="margin-top: 56px;">
        <div class="container py-5">
            <div class="row align-items-center g-4">
                <div class="col-md-6">
                    <h1 class="fw-bold mb-3">Cà phê Việt đậm đà,<br/>trên khắp mọi miền</h1>
                    <p class="fs-5 mb-4">Chain Coffee - chuỗi cửa hàng cà phê với thực đơn đa dạng, nguyên liệu chọn lọc và không gian thư giãn tại nhiều chi nhánh.</p>
                    <a th:href="@{/products}" class="btn btn-coffee btn-lg me-2">Xem thực đơn</a>
                    <a th:href="@{/stores}" class="btn btn-outline-coffee btn-lg">Tìm cửa hàng</a>
                </div>
                <div class="col-md-6 text-center">
                    <img th:src="@{/images/coffee/hero.svg}" class="img-fluid" style="max-height:360px;" alt=""/>
                </div>
            </div>
        </div>
    </section>

    <section class="container py-5">
        <h3 class="fw-semibold mb-4">Món nổi bật</h3>
        <div class="row g-3">
            <div class="col-6 col-md-4 col-lg-2" th:each="product: ${featuredProducts}">
                <div class="card product-card">
                    <a th:href="@{'/detail?productId='+${product.id}}">
                        <img th:src="${product.imageUrl}" class="card-img-top" alt=""/>
                    </a>
                    <div class="card-body">
                        <h6 class="mb-1" th:text="${product.name}">Cà phê đen đá</h6>
                        <p class="product-price mb-0" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">25.000 đ</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section class="py-5" style="background-color: var(--coffee-cream-2);">
        <div class="container">
            <h3 class="fw-semibold mb-4">Hệ thống cửa hàng</h3>
            <div class="row g-3">
                <div class="col-md-4" th:each="store: ${stores}">
                    <div class="card store-card h-100">
                        <img th:src="${store.imageUrl}" alt=""/>
                        <div class="card-body">
                            <h6 class="fw-semibold" th:text="${store.name}">Chain Coffee</h6>
                            <p class="mb-0 small text-muted" th:text="${store.address}">Địa chỉ</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</div>

</body>
</html>
