<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: main-fragment(
                                                ~{::title},
                                                ~{},
                                                ~{/fragments/app-fragments :: nav-default},
                                                ~{:: #cart-main-content},
                                                ~{/fragments/app-fragments :: copyright}
                                               )}">
<head>
    <title>Giỏ hàng - Chain Coffee</title>
</head>
<body>

<div id="cart-main-content" style="margin-top: 90px;">
    <div class="container py-4">
        <h4 class="fw-semibold mb-4">Giỏ hàng của bạn</h4>

        <form th:action="@{/update-cart}" method="post">
            <div class="card mb-3">
                <div class="table-responsive">
                    <table class="table align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Sản phẩm</th>
                            <th>Đơn giá</th>
                            <th style="width:120px;">Số lượng</th>
                            <th>Thành tiền</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c, iter: ${listCart}">
                            <td class="d-flex align-items-center gap-2">
                                <img th:src="${c.productImageUrl}" width="48" height="48" style="object-fit:cover" class="rounded"/>
                                <span th:text="${c.productName}">Cà phê đen đá</span>
                            </td>
                            <td th:text="${#numbers.formatDecimal(c.productPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">25.000 đ</td>
                            <td>
                                <input type="number" min="1" class="form-control form-control-sm"
                                       th:name="'quantity' + ${iter.index}" th:value="${c.quantity}"/>
                            </td>
                            <td th:text="${#numbers.formatDecimal(c.productPrice * c.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">25.000 đ</td>
                            <td>
                                <a th:href="@{'/delete-cart?productId=' + ${c.productId}}" class="text-danger"><i class="ti ti-trash"></i></a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listCart)}">
                            <td colspan="5" class="text-center text-muted py-4">Giỏ hàng trống</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <button type="submit" class="btn btn-outline-coffee">Cập nhật giỏ hàng</button>
                    <a th:href="@{/delete-cart}" class="btn btn-outline-danger" onclick="return confirm('Xoá toàn bộ giỏ hàng?')">Xoá tất cả</a>
                </div>
                <div class="text-end">
                    <p class="mb-2 fs-5">Tổng cộng: <strong th:text="${#numbers.formatDecimal(totalMoney, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</strong></p>
                    <a th:href="@{/checkout}" class="btn btn-coffee btn-lg">Tiến hành đặt hàng</a>
                </div>
            </div>
        </form>
    </div>
</div>

</body>
</html>
