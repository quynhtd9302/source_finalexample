<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main-layout :: main-fragment(
                                                ~{::title},
                                                ~{},
                                                ~{/fragments/app-fragments :: nav-default},
                                                ~{:: #product-main-content},
                                                ~{/fragments/app-fragments :: copyright}
                                               )}">
<head>
    <title>Thực đơn - QuynhHill Coffee</title>
</head>
<body>

<div id="product-main-content" style="margin-top: 90px;">
    <div class="container py-4">
        <div class="row">
            <div class="col-md-3 mb-4">
                <div class="card category-panel">
                    <div class="card-header bg-coffee text-white btn-coffee">Danh mục</div>
                    <div class="card-body">
                        <a th:href="@{/products}" class="fw-semibold d-block mb-2">Tất cả sản phẩm</a>
                        <div th:each="category: ${categories}" class="mb-2">
                            <a th:href="@{'/products?page=1&categoryId=' + ${category.id}}" class="fw-semibold" th:text="${category.categoryName}">Cà phê</a>
                            <div th:each="subCategory: ${category.subCategories}">
                                <a class="subcategory-link" th:href="@{'/products?page=1&subCategoryId=' + ${subCategory.id}}" th:text="${subCategory.subCategoryName}">Cà phê phin</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <h4 class="fw-semibold mb-4">Thực đơn</h4>

                <nav th:if="${totalPage}>1" aria-label="Page navigation">
                    <ul class="pagination justify-content-end">
                        <li th:each="index: ${#numbers.sequence(1, totalPage)}" class="page-item"
                            th:classappend="(${page}==${index})?'active':''">
                            <a th:href="@{'/products?page='+${index}}" th:text="${index}" class="page-link"></a>
                        </li>
                    </ul>
                </nav>

                <div class="row g-3">
                    <div th:each="product: ${products}" class="col-6 col-md-4">
                        <div class="card product-card">
                            <a th:href="@{'/detail?productId='+${product.id}}">
                                <img th:src="${product.imageUrl}" class="card-img-top" alt=""/>
                            </a>
                            <div class="card-body">
                                <a th:href="@{'/detail?productId='+${product.id}}" class="text-decoration-none">
                                    <h6 class="mb-1 text-dark" th:text="${product.name}">Cà phê đen đá</h6>
                                </a>
                                <p class="product-price mb-2" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'">25.000 đ</p>
                                <a th:href="@{'/add-to-cart?productId='+${product.id}}" class="btn btn-coffee btn-sm w-100">
                                    <i class="ti ti-shopping-cart-plus me-1"></i>Thêm vào giỏ
                                </a>
                            </div>
                        </div>
                    </div>
                    <div th:if="${#lists.isEmpty(products)}" class="text-center text-muted py-5">
                        Không có sản phẩm nào
                    </div>
                </div>

                <nav th:if="${totalPage}>1" class="mt-4">
                    <ul class="pagination justify-content-end">
                        <li th:each="index: ${#numbers.sequence(1, totalPage)}" class="page-item"
                            th:classappend="(${page}==${index})?'active':''">
                            <a th:href="@{'/products?page='+${index}}" th:text="${index}" class="page-link"></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</div>

</body>
</html>
