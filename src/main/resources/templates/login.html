<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập - QuynhHill Coffee</title>
    <link rel="shortcut icon" type="image/svg+xml" th:href="@{/images/coffee/favicon.svg}" />
    <link rel="stylesheet" th:href="@{/assets/libs/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/icons/tabler-icons/tabler-icons.css}">
    <link rel="stylesheet" th:href="@{/css/coffee-theme.css}">
</head>

<body>
<div class="container">
    <div class="auth-card">
        <div class="text-center mb-3">
            <img th:src="@{/images/coffee/logo.svg}" width="64" height="64" alt="QuynhHill Coffee"/>
            <h4 class="fw-semibold mt-2">QuynhHill Coffee</h4>
            <p class="text-muted">Đăng nhập để đặt hàng và theo dõi đơn hàng của bạn</p>
        </div>
        <div class="card">
            <div class="card-body p-4">
                <p class="text-success text-center" th:if="${message}" th:text="${message}"></p>
                <p class="text-danger text-center" th:if="${error}" th:text="${error}"></p>
                <form method="post" th:action="@{/login}">
                    <div class="mb-3">
                        <label class="form-label">Tên đăng nhập</label>
                        <input type="text" name="username" class="form-control" autofocus="true" required/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu</label>
                        <input type="password" name="password" class="form-control" required/>
                    </div>
                    <button type="submit" class="btn btn-coffee w-100">Đăng nhập</button>
                </form>

                <div th:if="${googleEnabled or facebookEnabled}">
                    <div class="text-center text-muted my-3">hoặc</div>
                    <a th:if="${googleEnabled}" th:href="@{/oauth2/authorization/google}"
                       class="btn btn-outline-coffee w-100 mb-2">
                        <i class="ti ti-brand-google me-1"></i>Đăng nhập bằng Google
                    </a>
                    <a th:if="${facebookEnabled}" th:href="@{/oauth2/authorization/facebook}"
                       class="btn btn-outline-coffee w-100">
                        <i class="ti ti-brand-facebook me-1"></i>Đăng nhập bằng Facebook
                    </a>
                </div>

                <p class="text-center mt-3 mb-0">Chưa có tài khoản? <a th:href="@{/registration}">Tạo tài khoản</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
