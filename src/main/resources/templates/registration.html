<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng ký - Chain Coffee</title>
    <link rel="shortcut icon" type="image/svg+xml" th:href="@{/images/coffee/favicon.svg}" />
    <link rel="stylesheet" th:href="@{/assets/libs/bootstrap/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/icons/tabler-icons/tabler-icons.css}">
    <link rel="stylesheet" th:href="@{/css/coffee-theme.css}">
</head>

<body>
<div class="container">
    <div class="auth-card">
        <div class="text-center mb-3">
            <img th:src="@{/images/coffee/logo.svg}" width="64" height="64" alt="Chain Coffee"/>
            <h4 class="fw-semibold mt-2">Tạo tài khoản</h4>
            <p class="text-muted">Đăng ký để đặt hàng nhanh hơn tại Chain Coffee</p>
        </div>
        <div class="card">
            <div class="card-body p-4">
                <form method="post" th:action="@{/registration}" th:object="${userForm}">
                    <div class="mb-3">
                        <label class="form-label">Tên đăng nhập</label>
                        <input type="text" th:field="*{username}" class="form-control" autofocus="true" required/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" class="form-control" required/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Mật khẩu</label>
                        <input type="password" th:field="*{password}" class="form-control" required/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nhập lại mật khẩu</label>
                        <input type="password" th:field="*{passwordConfirm}" class="form-control" required/>
                        <div class="text-danger small" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></div>
                    </div>
                    <button type="submit" class="btn btn-coffee w-100">Đăng ký</button>
                </form>
                <p class="text-center mt-3 mb-0">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
